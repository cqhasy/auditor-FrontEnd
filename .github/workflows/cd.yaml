name: Frontend CD

on:
  workflow_run:
    workflows: ["Frontend CI"]
    types: [completed]
  push:
    branches:
      - main
jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    name: Deploy To Server
    runs-on: ubuntu-latest
    if: github.repository == 'cqhasy/auditor-FrontEnd'
    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_ADDR }} >> ~/.ssh/known_hosts
      - name: SSH into server and deploy
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_ADDR }} << EOF
           set -e
           cd ./muxi-auditor
           docker pull ${{ secrets.ALIYUN_REGISTRY }}/muxi/auditor_frontend:latest
           docker compose -f docker-compose.yaml up -d --no-deps auditor-frontend
           docker image prune -a -f
          EOF
