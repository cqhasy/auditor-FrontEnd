name: Frontend CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: |
          npm install -g pnpm
          pnpm install

      - name: Test
        run: pnpm test || echo "no test"

      - name: Build
        run: pnpm build

  build-docker:
    steps:
      - uses: actions/checkout@v6
        with:
         ref: ${{ github.event.pull_request.head.sha }}

      - name: Login to Docker
        if: github.repository == 'cqhasy/auditor-FrontEnd' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USERNAME }}
          password: ${{ secrets.ALIYUN_PASSWORD }}  

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (No Push for PR)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: |
            muxi/auditor_frontend:${{ github.sha }}
          file: ./Dockerfile
          build-args:
            Project_Name=auditor-frontend
            Port=8080

      - name: Build And Push ( for main )
        if: github.repository == 'cqhasy/auditor-FrontEnd' && github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.ALIYUN_REGISTRY }}/muxi/auditor_frontend:${{ github.sha }}
            ${{ secrets.ALIYUN_REGISTRY }}/muxi/auditor_frontend:latest
          file: ./Dockerfile
          build-args:
           Project_Name=auditor-frontend
           Port=8080
            